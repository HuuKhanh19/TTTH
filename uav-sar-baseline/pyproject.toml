[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-sar-baseline"
version = "0.1.0"
description = "Reproducible CPU baselines on the published SAREnv benchmark"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "shapely>=2.0", "pyproj>=3.6", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8", "geopandas>=1"]

[tool.setuptools.packages.find]
include = ["sar_baseline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
